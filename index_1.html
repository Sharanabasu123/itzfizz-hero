<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome Itzfizz – Scroll Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  :root { --bg:#e6e9ec; --road:#2b3342; --ink:#1c2330; --lane:#f1efe8; --car:#0f8b8d; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font-family:'Space Grotesk', system-ui, sans-serif; }
  /* Tall wrapper creates the scroll distance; hero stays pinned inside it */
  #scroll-space { height:400vh; position:relative; }
  #hero { position:sticky; top:0; height:100vh; overflow:hidden; }
  #road { position:absolute; left:50%; top:0; width:min(34vw, 300px); min-width:170px; height:100%;
          transform:translateX(-50%); background:var(--road); overflow:hidden; }
  #lines { position:absolute; left:50%; top:-100%; width:6px; height:300%; margin-left:-3px; will-change:transform;
           background:repeating-linear-gradient(to bottom, var(--lane) 0 60px, transparent 60px 130px); }
  #car { position:absolute; left:50%; top:50%; width:clamp(70px, 9vw, 120px); margin-left:calc(clamp(70px, 9vw, 120px) / -2);
         will-change:transform; filter:drop-shadow(0 18px 14px rgba(0,0,0,.45)); }
  #title { position:absolute; top:7vh; left:0; right:0; text-align:center; z-index:5; padding:0 1rem; }
  #title h1 { font-weight:300; font-size:clamp(1.1rem, 3.4vw, 2.6rem); letter-spacing:.55em; margin:0; padding-left:.55em; }
  .ch { display:inline-block; opacity:0; }
  .stat { opacity:0; }
  .stat b { font-weight:700; font-size:clamp(2rem, 5vw, 4rem); line-height:1; display:block; }
  .stat span { font-size:.95rem; max-width:13rem; display:block; margin-top:.4rem; }
  @media (prefers-reduced-motion: reduce) { .ch, .stat { opacity:1 !important; } }
</style>
</head>
<body>
<div id="scroll-space">
  <section id="hero" aria-label="Welcome to Itzfizz">
    <div id="title"><h1 id="headline" aria-label="Welcome Itzfizz">WELCOME ITZFIZZ</h1></div>

    <!-- Stats: left and right of the road -->
    <div class="absolute z-10 left-4 md:left-[6vw] top-[26vh] flex flex-col gap-10 md:gap-16 text-left">
      <div class="stat"><b data-to="58">0%</b><span>Increase in pick up point use</span></div>
      <div class="stat"><b data-to="27">0%</b><span>Increase in pick up point use</span></div>
    </div>
    <div class="absolute z-10 right-4 md:right-[6vw] top-[26vh] flex flex-col gap-10 md:gap-16 text-right">
      <div class="stat"><b data-to="23">0%</b><span class="ml-auto">Decreased in customer phone calls</span></div>
      <div class="stat"><b data-to="40">0%</b><span class="ml-auto">Decreased in customer phone calls</span></div>
    </div>

    <div id="road"><div id="lines"></div></div>

    <!-- Top-view car (original SVG) -->
    <svg id="car" viewBox="0 0 120 260" role="img" aria-label="Car seen from above">
      <rect x="6" y="48" width="16" height="42" rx="6" fill="#0d1117"/><rect x="98" y="48" width="16" height="42" rx="6" fill="#0d1117"/>
      <rect x="6" y="176" width="16" height="46" rx="6" fill="#0d1117"/><rect x="98" y="176" width="16" height="46" rx="6" fill="#0d1117"/>
      <path d="M60 4 C92 4 104 36 106 78 L108 190 C108 232 92 256 60 256 C28 256 12 232 12 190 L14 78 C16 36 28 4 60 4Z" fill="var(--car)"/>
      <rect x="55" y="8" width="10" height="240" rx="5" fill="#f1efe8" opacity=".85"/>
      <path d="M30 92 C40 78 80 78 90 92 L86 120 L34 120Z" fill="#0d1117" opacity=".9"/>
      <rect x="34" y="124" width="52" height="46" rx="8" fill="#0b6d6f"/>
      <path d="M34 176 L86 176 L90 206 C80 216 40 216 30 206Z" fill="#0d1117" opacity=".9"/>
      <path d="M26 24 L44 18 L40 30Z M94 24 L76 18 L80 30Z" fill="#fff6c2"/>
      <rect x="28" y="238" width="18" height="5" rx="2" fill="#ff4b4b"/><rect x="74" y="238" width="18" height="5" rx="2" fill="#ff4b4b"/>
    </svg>
  </section>
</div>

<script>
  gsap.registerPlugin(ScrollTrigger);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Split headline into letters for the staggered intro
  const h = document.getElementById('headline');
  h.innerHTML = [...h.textContent].map(c => c === ' ' ? '&nbsp;&nbsp;' : `<span class="ch" aria-hidden="true">${c}</span>`).join('');

  // Initial positions: car starts below the fold area, road lines at rest
  const car = document.getElementById('car');
  const vh = () => window.innerHeight;
  gsap.set(car, { yPercent: -50, y: () => vh() * 0.38 });

  // 1) Page-load animation (time-based, runs once)
  if (!reduce) {
    const intro = gsap.timeline({ defaults: { ease: 'power3.out' } });
    intro.fromTo('.ch', { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.9, stagger: 0.05 })
         .fromTo('.stat', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, stagger: 0.35 }, '-=0.3');
    document.querySelectorAll('.stat b').forEach((el, i) => {
      const o = { v: 0 };
      gsap.to(o, { v: +el.dataset.to, duration: 1.6, delay: 1.4 + i * 0.35, ease: 'power2.out',
        onUpdate: () => el.textContent = Math.round(o.v) + '%' });
    });
  } else {
    document.querySelectorAll('.stat b').forEach(el => el.textContent = el.dataset.to + '%');
  }

  // 2) Scroll-linked animation (tied to scroll progress; scrub: 1 adds smoothing/inertia)
  if (!reduce) {
    const tl = gsap.timeline({
      scrollTrigger: { trigger: '#scroll-space', start: 'top top', end: 'bottom bottom', scrub: 1 }
    });
    tl.to(car, { y: () => -vh() * 0.38, scale: 1.25, ease: 'none' }, 0)              // drives up the road
      .to(car, { rotation: 4, ease: 'sine.inOut', yoyo: true, repeat: 3, duration: 0.25 }, 0) // gentle sway
      .to('#lines', { yPercent: 33.3, ease: 'none' }, 0)                              // road moves past
      .to('#title', { y: -40, opacity: 0.2, ease: 'none' }, 0.55);
    ScrollTrigger.addEventListener('refreshInit', () => gsap.set(car, { y: vh() * 0.38 }));
  }
</script>
</body>
</html>
